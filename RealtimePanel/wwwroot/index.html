<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>Realtime Panel</title>
</head>
<body>
    <h1>Realtime Panel</h1>

    <p>Статус: <b id="status">подключение...</b></p>
    <p>Ваш ID: <code id="connId">—</code></p>
    <p>Онлайн: <b id="onlineCount">0</b></p>

    <hr />

    <div id="log" style="border:1px solid #ccc; padding:10px; height:300px; overflow-y:auto; font-family:monospace;"></div>

    <hr />
    <h3>Комнаты</h3>
        <p>
            <input id="roomInput" type="text" placeholder="Название комнаты" />
            <button id="joinBtn" disabled>Войти</button>
            <button id="leaveBtn" disabled>Выйти</button>
        </p>
        <p>Текущая комната: <b id="currentRoom">—</b></p>

        <p>
            <input id="roomMsgInput" type="text" placeholder="Сообщение в комнату..." />
            <button id="sendRoomBtn" disabled>Отправить в комнату</button>
        </p>
        <p id="typingIndicator" style="color:#888; font-style:italic; display:none;">
            Пользователь печатает…
        </p>
    <hr />

    <input id="msgInput" type="text" placeholder="Сообщение..." />
    <button id="sendBtn" disabled>Отправить</button>
    
    <hr />

    <h3>Приватное сообщение</h3>
    <p>
        <input id="privateTargetInput" type="text" placeholder="ID получателя" size="40" />
        <input id="privateTextInput" type="text" placeholder="Текст..." />
        <button id="sendPrivateBtn" disabled>Отправить приватно</button>
    </p>

    <hr />

    <h3>Внешнее уведомление в комнату</h3>
    <p>
        <input id="externalRoomInput" type="text" placeholder="Комната" />
        <input id="externalRoomTextInput" type="text" placeholder="Текст..." />
        <button id="sendExternalRoomBtn">Отправить через HTTP</button>
    </p>

    <hr />
    <h3>Системное сообщение</h3>
    <input id="systemInput" type="text" placeholder="Текст системного сообщения..." />
    <button id="sendSystemBtn">Отправить всем</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
    <script src="/js/app.js"></script>

</body>
</html>
